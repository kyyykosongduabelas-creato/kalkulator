<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator Sederhana</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f2f2f2; font-family: sans-serif; }
    .kalkulator { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 220px; }
    #layar { width: 100%; height: 50px; margin-bottom: 10px; text-align: right; font-size: 1.2rem; padding: 5px; box-sizing: border-box; }
    .tombol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    button { padding: 25px; font-size: 1rem; cursor: pointer; border: none; background: #eee; border-radius: 4px; }
    button:hover { background: #ddd; }
  </style>
</head>
<body>
  <div class="kalkulator">
    <input type="text" id="layar" disabled>
    <div class="tombol">
      <button onclick="bersihkan()">C</button>
      <button onclick="tambah('/')">/</button>
      <button onclick="tambah('*')">*</button>
      <button onclick="tambah('-')">-</button>
      <button onclick="tambah('7')">7</button>
      <button onclick="tambah('8')">8</button>
      <button onclick="tambah('9')">9</button>
      <button onclick="tambah('+')">+</button>
      <button onclick="tambah('4')">4</button>
      <button onclick="tambah('5')">5</button>
      <button onclick="tambah('6')">6</button>
      <button onclick="hitung()" style="grid-row: span 2; background: #4CAF50; color: white;">=</button>
      <button onclick="tambah('1')">1</button>
      <button onclick="tambah('2')">2</button>
      <button onclick="tambah('3')">3</button>
      <button onclick="tambah('0')" style="grid-column: span 2;">0</button>
      <button onclick="tambah('.')">.</button>
    </div>
  </div>

  <script>
    const layar = document.getElementById('layar');
    function tambah(nilai) { layar.value += nilai; }
    function bersihkan() { layar.value = ''; }
    function hitung() { layar.value = eval(layar.value); }
  </script>

</body>
</html>
