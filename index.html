<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Diri</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ea6692;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-bottom: 15px;
        }

        .card h1 {
            font-size: 1.4rem;
            color: #222;
        }

        .role {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 0.9rem;
        }

        table td:first-child {
            color: #667eea;
            font-weight: bold;
            width: 35%;
        }

        table td:last-child {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="foto.jpg" alt="Foto Profil">

        <h1>lucky adi irawan</h1>
        <p class="role">Pelajar</p>

        <table>
            <tr><td>Nama</td><td>lucky adi irawan</td></tr>
            <tr><td>TTL</td><td>palembang, 12 Mei 2008</td></tr>
            <tr><td>JK</td><td>Laki-laki</td></tr>
            <tr><td>Alamat</td><td>kota palembang</td></tr>
            <tr><td>Hobi</td><td>bermain bulutangkis</td></tr>
        </table>
    </div>

</body>
</html>
